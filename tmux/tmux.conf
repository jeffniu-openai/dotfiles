set -g history-limit 100000
set -g mouse on
set -g mode-keys vi
set -g status-keys vi
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on

# Treat tmux windows like editor/browser tabs.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#W"

# Make new windows and splits start in the current pane's directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-like pane navigation and resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r M-h select-pane -L
bind -r M-j select-pane -D
bind -r M-k select-pane -U
bind -r M-l select-pane -R
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind z resize-pane -Z

# Fast tab/window navigation.
bind -r C-h previous-window
bind -r C-l next-window
bind -r H swap-window -t -1\; previous-window
bind -r L swap-window -t +1\; next-window
bind Tab last-window

# Also support Alt+arrow-style navigation without the tmux prefix.
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-S-Left swap-window -t -1\; previous-window
bind -n M-S-Right swap-window -t +1\; next-window

# Friendlier window management.
bind Escape copy-mode
bind n command-prompt -p "window name:" "rename-window '%%'"
bind x confirm-before -p "kill window #W? (y/n)" kill-window
bind r source-file ~/.tmux.conf \; display-message "reloaded ~/.tmux.conf"

# Vim-like copy mode: Prefix Escape, then v/y/C-v like Vim visual mode.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse

# Compact, readable window list.
set -g status-position top
set -g status-interval 5
set -g status-left-length 32
set -g status-right-length 80
set -g status-left "#[bold]#S #[default]"
set -g status-right "%Y-%m-%d %H:%M"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[reverse]#I:#W#[default] "
